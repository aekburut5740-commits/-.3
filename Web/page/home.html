<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Statistics - ANW</title>
    <link rel="icon" href="../pic/logo.png">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div id="box-shadow" class="box-shadow">
        <div id="logout-box" class="logout-box">
            <h1>ต้องการออกจากระบบใช่มั้ย?</h1>
            <div class="logout-option">
                <div id="option-no" class="option-no">
                    <p>ไม่</p>
                </div>
                <div id="option-yes" class="option-yes">
                    <p>ใช่</p>
                </div>
            </div>
        </div>
    </div>

    <div class="flex">
        <div class="sidebar">
            <div class="cap">
                <i class="fa-solid fa-graduation-cap i-cap"></i>
            </div>
            <div class="menu">
                <a href="home.html" class="menu-label-now">
                    <i class="fa-solid fa-house"></i>
                    <span>หน้าหลัก</span>
                </a>
                <a href="home.html" class="menu-label-1">
                    <i class="fa-regular fa-square-check"></i>
                    <span>เช็คชื่อ</span>
                </a>
                <a href="home.html" class="menu-label-2">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span>ย้อนหลัง</span>
                </a>
                <a href="home.html" class="menu-label-3">
                    <i class="fa-solid fa-user"></i>
                    <span>รายบุคคล</span>
                </a>
                <a href="home.html" class="menu-label-4">
                    <i class="fa-regular fa-chart-bar"></i>
                    <span>สถิติ</span>
                </a>
                <a href="home.html" class="menu-label-5">
                    <i class="fa-solid fa-users-gear"></i>
                    <span>จัดการนักเรียน</span>
                </a>
            </div>
            <b><a href="#" class="setting">การตั้งค่า</a></b>
            <div id="logout" class="logout">
                <b>
                    <p href="../login.html">ออกจากระบบ</p>
                </b>
            </div>
        </div>

        <div class="main-box">
            <div class="head">
                <h1>สรุปการมาเรียน</h1>
            </div>
            <div class="content">
                <div class="graph">
                    <h1>กราฟวันนี้</h1>
                    <hr>
                    <div class="chart">
                        <canvas id="graph1"></canvas>
                        <canvas id="graph2"></canvas>
                    </div>
                </div>
                <div class="status">
                    <div class="status-all">
                        <h1><i class="fa-solid fa-users-line"></i></h1>
                        <p>ทั้งหมด</p>
                        <b>
                            <p><span id="stu-all"></span> คน</p>
                        </b>
                    </div>
                    <div class="status-miss">
                        <h1><i class="fa-solid fa-question"></i></h1>
                        <p>ขาด</p>
                        <b>
                            <p><span id="stu-miss"></span> คน</p>
                        </b>
                    </div>
                    <div class="status-leave">
                        <h1><i class="fa-solid fa-house"></i></h1>
                        <p>ลา</p>
                        <b>
                            <p><span id="stu-leave"></span> คน</p>
                        </b>
                    </div>
                    <div class="status-late">
                        <h1><i class="fa-solid fa-person-running"></i></h1>
                        <p>สาย</p>
                        <b>
                            <p><span id="stu-late"></span> คน</p>
                        </b>
                    </div>
                    <div class="status-come">
                        <h1><i class="fa-solid fa-briefcase"></i></h1>
                        <p>มา</p>
                        <b>
                            <p><span id="stu-come"></span> คน</p>
                        </b>
                    </div>

                    <div class="box-stu">
                        <div id="stu-status" class="stu-status">
                            <select id="status-option" class="option">
                                <option value="1" selected>มา</option>
                                <option value="2">สาย</option>
                                <option value="3">ลา</option>
                                <option value="4">ขาด</option>
                            </select>
                            <ul id="stu-status-list"></ul>
                        </div>
                    </div>

                </div>
            </div>
        </div>

    </div>


    <script src="../js/sidebar.js"></script>
    <script src="../js/student.js"></script>
    <script src="../js/home.js"></script>
</body>

</html>
